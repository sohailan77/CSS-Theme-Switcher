<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS-Theme-Switcher</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <form action="">
            <input type="radio" name="theme" id="theme1" checked>
            <label for="theme1">Light</label>

            <input type="radio" name="theme" id="theme2">
            <label for="theme2">Dark</label>
            
            <input type="radio" name="theme" id="theme3">
            <label for="theme3">Custom</label>
        </form>

        <h1>Hello, World!</h1>
        <p>This is a simple card that changes theme with CSS variables</p>

        <button>Primary Button</button>
    </div>
    
</body>
</html>
